<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Register</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 480px; margin: auto; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    label span { font-weight: normal; font-size: 0.85em; color: #555; }
    input[type="text"],
    input[type="email"],
    input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 12px; font-size: 0.95em; }
  </style>
</head>
<body>
  <h2>Create Account</h2>

  <div id="regForm">
    <label>Username (required)
      <input id="username" type="text" minlength="3" autocomplete="username" />
    </label>
    <label>Password (required)
      <input id="password" type="password" minlength="6" autocomplete="new-password" />
    </label>
    <label>Full Name (optional)
      <input id="full_name" type="text" autocomplete="name" />
    </label>
    <label>Email (optional)
      <input id="email" type="email" autocomplete="email" />
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px; max-width: 300px;">
  <label for="phone">Phone (optional)</label>
  
  <input id="phone" type="tel" autocomplete="tel"
         placeholder="+91-9876543210"
         pattern="^\+[1-9]\d{1,3}-\d{7,12}$"
         title="Format: +CountryCode-Number" />
         
  <small style="color: var(--color-text-secondary, #888); font-size: 0.8em;">
    Format: +CountryCode-Number 
  </small>
  
  <button id="submitBtn" onclick="handleRegister()" style="width: fit-content;">
    Register
  </button>
</div>
  </div>

  <div class="msg" id="msg"></div>

  <script>
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    async function handleRegister() {
      const username  = document.getElementById('username').value.trim();
      const password  = document.getElementById('password').value;
      const full_name = document.getElementById('full_name').value.trim();
      const email     = document.getElementById('email').value.trim();
      const phone     = document.getElementById('phone').value.trim();

      // Basic client-side guard
      if (username.length < 3) {
        showMsg('Username must be at least 3 characters.', 'red');
        return;
      }
      if (password.length < 6) {
        showMsg('Password must be at least 6 characters.', 'red');
        return;
      }

      // Only send non-empty optional fields
      const payload = { username, password };
      if (full_name) payload.full_name = full_name;
      if (email)     payload.email     = email;
      if (phone)     payload.phone     = phone;

      btn.disabled = true;
      showMsg('Submitting…', '#333');

      try {
        const res  = await fetch('/register', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload)
        });
        const body = await res.json();

        if (!res.ok) {
          showMsg(body.error || 'Registration failed.', 'red');
        } else {
          showMsg('Registered successfully! ID: ' + body.id, 'green');
          document.getElementById('username').value  = '';
          document.getElementById('password').value  = '';
          document.getElementById('full_name').value = '';
          document.getElementById('email').value     = '';
          document.getElementById('phone').value     = '';
        }
      } catch (err) {
        showMsg('Network error — is the server running?', 'red');
      } finally {
        btn.disabled = false;
      }
    }

    function showMsg(text, color) {
      msg.textContent  = text;
      msg.style.color  = color;
    }
  </script>
</body>
</html>
